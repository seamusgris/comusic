name: Atualizar lista de cifras
on:
  push:
    paths: ['cifras/**', 'tags.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/gerar_lista.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cifras.json
          git diff --cached --quiet || (git commit -m "Atualiza lista de cifras" && git push)
